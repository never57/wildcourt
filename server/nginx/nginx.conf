# WildCourt 管理后台 Nginx 配置（宿主 bind mount 版，蓝绿切换用）
# 托管前端静态文件 + 反代 API 与 SignalR（WebSocket）。
# 注意：本文件被 nginx 容器 bind mount（docker-compose.yml），
# 蓝绿部署脚本 deploy.sh 会修改下方 proxy_pass 的目标（api-blue ↔ api-green），
# 修改后执行 nginx -s reload 即生效（毫秒级），勿在此手写 api 服务名以外的目标。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传较大文件（服务端部署 zip / SQL 文件），nginx 默认限制 1MB
    client_max_body_size 200m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端 SPA 路由回退（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 管理后台 API 反代（保留 /api 前缀）；目标由 deploy.sh 在蓝绿容器间切换
    location /api/ {
        proxy_pass http://api-blue:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket（/hub/chat），需 Upgrade/Connection 头支持长连接
    location /hub/ {
        proxy_pass http://api-blue:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
